<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Walker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <main class="container">
        <!-- Top Bar for Share Button -->
        <div class="top-bar">
            <button class="share-btn" onclick="sharePage()" aria-label="Share Page">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </button>
        </div>

        <!-- Profile Image -->
        <div class="profile-img-wrapper">
            <img src="https://ik.imagekit.io/lzl0sgfim/WhatsApp%20Image%202026-09-24%20at%2018.26.39.jpeg"
                alt="Taffany Williamson" class="profile-img">
        </div>

        <!-- Profile Details -->
        <h1 class="name">Nancy Walker</h1>
        <p class="tagline">@NancyWalker</p>
        <p class="bio">As an Amazon Associate, I earn from qualifying purchases.</p>

        <!-- Social Icons -->
        <div class="social-icons">
            <a href="https://www.instagram.com/taffany_williamson" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>

        <!-- Action Links -->
        <div class="links">
            <a href="https://a.co/d/0ePaiBPi" class="link-btn">Amazon storefront</a>
            <a href="https://a.co/d/0ePaiBPi" class="link-btn">Instagram virals</a>
            <a href="https://a.co/d/0f2FxEGA" class="link-btn">Space Saving Things</a>
        </div>
    </main>

    <!-- Share Script -->
    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(err => console.log('Share canceled'));
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        }
    </script>
</body>

</html>
